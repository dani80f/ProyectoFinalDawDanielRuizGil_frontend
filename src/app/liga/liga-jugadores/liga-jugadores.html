<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>

<div *ngIf="!gestionVista()">
  <h1>Mercado de Fichajes</h1>

  <mat-form-field appearance="fill">
    <mat-label>Buscar jugador</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filtrar por nombre o posición">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <!-- Imagen -->
    <ng-container matColumnDef="imagen">
      <th mat-header-cell *matHeaderCellDef>Imagen</th>
      <td mat-cell *matCellDef="let jugador"><img [src]="jugador.imagen" style="max-height: 80px;"></td>
    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let jugador">{{jugador.nombre}}</td>
    </ng-container>

    <!-- Apellidos -->
    <ng-container matColumnDef="apellidos">
      <th mat-header-cell *matHeaderCellDef>Apellidos</th>
      <td mat-cell *matCellDef="let jugador">{{jugador.apellidos}}</td>
    </ng-container>

    <!-- Posición -->
    <ng-container matColumnDef="posicion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Posición</th>
      <td mat-cell *matCellDef="let jugador">{{jugador.posicion}}</td>
    </ng-container>

    <!-- Media -->
    <ng-container matColumnDef="media">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Media</th>
      <td mat-cell *matCellDef="let jugador">{{jugador.media}}</td>
    </ng-container>

    <!-- Precio -->
    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
      <td mat-cell *matCellDef="let jugador">{{jugador.precio}} €</td>
    </ng-container>

    <!-- Fichar -->
    <ng-container matColumnDef="fichar">
      <th mat-header-cell *matHeaderCellDef>Fichar</th>
      <td mat-cell *matCellDef="let jugador">
        <button mat-button color="primary" *ngIf="!estaFichado(jugador)" (click)="fichar(jugador.id,jugador.nombre,jugador.apellidos,jugador.posicion,jugador.media,jugador.precio)">
          Fichar
        </button>
        <span *ngIf="estaFichado(jugador)">Fichado</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>

<div *ngIf="gestionVista()">
  <h1>Gestión de jugadores</h1>
</div>





</body>
</html>
